name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: test-only-secret
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      CRPT_THUMBPRINT: test
      OMS_ID: test
      OMS_CONN_ID: test
      CRPT_SANDBOX: "true"
      CRPT_MOCK_MODE: "true"
      GS1_PREFIX: "0000000"
      GS1_EXTENSION_DIGIT: "0"
      DEBUG: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.dev.txt
      - run: pip install -r requirements.txt -r requirements.dev.txt
      - run: python -m pytest -q
      - run: python -m compileall app ../signer_service

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
