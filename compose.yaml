
services:
  postgres:
    image: postgres:16
    ports:
    - "5432:5432"

    env_file:
      - .env

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7

  api:
    image: aggr-backend
    build: ./backend

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  celery:
    image: aggr-backend
    build: ./backend
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=3"]

volumes:
  pgdata:
